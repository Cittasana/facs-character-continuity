name: Release skill ZIP

# Builds the uploadable ZIP and attaches it to a GitHub Release.
# Runs when a release is published in the GitHub UI, or when a v* tag is pushed.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP (skill folder at the top level of the archive)
        run: |
          cd skills
          zip -r ../facs-character-continuity.zip facs-character-continuity -x '*.DS_Store'

      - name: Attach ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" facs-character-continuity.zip --clobber
          else
            gh release create "$TAG" facs-character-continuity.zip --title "$TAG" --generate-notes
          fi
